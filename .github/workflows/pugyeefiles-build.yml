name: PugyeeFiles Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      - name: Set up NDK r26d
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true
          local-cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            file_operations/target/
          key: ${{ runner.os }}-cargo-r26d-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-r26d-

      - name: Setup Rust for Android
        run: |
          cd file_operations
          chmod +x setup_rust_android.sh
          ./setup_rust_android.sh

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 --decode > ${{ github.workspace }}/pugyeefiles.jks
          echo "Keystore size: $(wc -c < ${{ github.workspace }}/pugyeefiles.jks) bytes"

      - name: Write signing config
        run: |
          cat >> gradle.properties << EOF
          RELEASE_STORE_FILE=${{ github.workspace }}/pugyeefiles.jks
          RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS=${{ secrets.KEYSTORE_ALIAS }}
          RELEASE_KEY_PASSWORD=${{ secrets.KEYSTORE_KEY_PASSWORD }}
          EOF

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        run: ./gradlew assembleFdroidRelease --stacktrace
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/pugyeefiles.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PugyeeFiles-release
          path: app/build/outputs/apk/fdroid/release/*.apk
          retention-days: 30
